services:
  app:
    build: .
    restart: unless-stopped
    environment:
      PORT: 2567
      GAME_ROUNDS: 20
    expose:
      - "2567"

  proxy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config: