name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v2
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Build shared packages
        run: pnpm --filter @trastero/shared --filter @trastero/game-core exec tsc -b

      - name: Typecheck
        run: pnpm -r --filter "./packages/*" --filter "./apps/*" run typecheck

      - name: Unit + anti-leak tests
        run: pnpm exec vitest run

      - name: Build client
        run: pnpm --filter @trastero/client run build

      - name: Scan bundle for secret values
        run: node tools/check-leak.mjs

      - name: E2E WebSocket smoke (2 clients, 2 rounds)
        run: |
          GAME_ROUNDS=2 pnpm --filter @trastero/server run start &
          for i in $(seq 1 30); do
            curl -sf http://localhost:2567/healthz && break
            sleep 1
          done
          node tools/smoke.mjs
          node tools/reconnect-smoke.mjs

  docker:
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@v4
      - name: Build docker image
        run: docker build -t trastero-wars:ci .